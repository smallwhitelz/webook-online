syntax = "proto3";

package ranking.v1;
option go_package = "ranking/v1;rankingv1";
import "google/protobuf/timestamp.proto"; // 使用timestamp类型

message Author {
  int64 id = 1;
  string name = 2;
  // 添加其他作者相关字段
}

message Article {
  int64 id = 1;
  string title = 2;
  int32 status = 3;
  string content = 4;
  Author author = 5;
  google.protobuf.Timestamp ctime = 6;
  google.protobuf.Timestamp utime = 7;
}

service RankingService {
    rpc TopN(TopNRequest) returns (TopNResponse);
      rpc GetTopN(GetTopNRequest) returns (GetTopNResponse);
}

message TopNRequest {

}

message TopNResponse {

}

message GetTopNRequest{

}

message GetTopNResponse {
  repeated Article articles = 1;
}