syntax = "proto3";

package reward.v1;
option go_package = "reward/v1;rewardv1";


service RewardService{
  rpc PreReward(PreRewardRequest) returns (PreRewardResponse);
  rpc UpdateReward(UpdateRewardRequest) returns (UpdateRewardResponse);
  rpc GetReward(GetRewardRequest) returns (GetRewardResponse);
}

enum RewardStatus {
  RewardStatusUnknown = 0;
  RewardStatusInit = 1;
  RewardStatusPayed = 2;
  RewardStatusFailed = 3;
}

message GetRewardRequest {
  // rid和打赏的人
  int64 rid = 1;
  int64 uid = 2;
}

// 正常来说，对于外面的人来说只关心打赏成功了没
// 不要提前定义字段，直到有需要
message GetRewardResponse {
  RewardStatus status = 1;
}

message UpdateRewardRequest {
  string biz_trade_no = 1;
  RewardStatus status = 2;
}

message UpdateRewardResponse {

}

message PreRewardRequest {
  // 代表被打赏的东西
  string biz = 1;
  int64 biz_id = 2;
  // 给用户看，让用户明白自己打赏的是什么东西
  string biz_name = 3;
  // 被打赏人，收钱的人
  int64 target_uid = 4;
  // 打赏人，付钱的人
  int64 uid = 5;
  // 打赏金额
  int64 amt = 6;
}

message PreRewardResponse {
  // 返回的是二维码的链接
  string code_url = 1;
  // 代表这一次打赏的id
  int64 rid = 2;
}