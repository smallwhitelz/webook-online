syntax = "proto3";

package code.v1;
option go_package = "code/v1;codev1";

service CodeService {
    rpc Send(CodeSendRequest) returns (CodeSendResponse);
    rpc Verify(CodeVerifyRequest) returns (CodeVerifyResponse);
}

message CodeSendRequest {
  string biz = 1;
  string phone = 2;
}

message CodeSendResponse{

}

message CodeVerifyRequest {
  string biz = 1;
  string phone = 2;
  string input_code = 3;
}

message CodeVerifyResponse {
  bool answer = 1;
}